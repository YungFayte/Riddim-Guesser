<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddim / Dubstep Guesser</title>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #16181f;
      --accent-color: #00ffcc;
      --text-color: #ffffff;
      --muted-color: #a0a5b5;
      --error-color: #ff4757;
      --debug-color: #e36414;
      --sc-orange: #ff5500;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; position: relative; overflow-x: hidden; }
    .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; border: 1px solid #262936; position: relative; z-index: 1; }
    h1 { color: var(--accent-color); font-size: 1.8rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
    p.subtitle { color: var(--muted-color); font-size: 0.9rem; margin-bottom: 15px; }

    /* Confetti Canvas Across Full Viewport */
    #confetti-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 999; }

    /* Debug Banner & Live Timer */
    .test-mode-banner { display: none; background: rgba(227, 100, 20, 0.2); color: var(--debug-color); border: 1px solid var(--debug-color); padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; }
    .timestamp-finder { font-family: monospace; font-size: 1.1rem; color: #fff; background: #000; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--debug-color); margin-top: 5px; display: inline-block; }

    .scoreboard { display: flex; justify-content: space-between; background: #0d0e12; padding: 12px 18px; border-radius: 8px; border: 1px solid #262936; margin-bottom: 15px; }
    .score-stat { text-align: center; }
    .score-label { font-size: 0.75rem; color: var(--muted-color); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }

    .diff-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
    .diff-easy { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
    .diff-medium { background: rgba(255, 171, 0, 0.2); color: #ffab00; border: 1px solid #ffab00; }
    .diff-hard { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
    .diff-expert { background: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }
    .diff-impossible { background: rgba(230, 126, 34, 0.2); color: #e67e22; border: 1px solid #e67e22; box-shadow: 0 0 10px rgba(230, 126, 34, 0.4); }

    /* Meter Container with Interval Notches */
    .audio-progress-container { width: 100%; height: 16px; background: #0d0e12; border: 1px solid #333748; border-radius: 6px; overflow: hidden; margin-bottom: 15px; position: relative; cursor: default; }
    .audio-progress-container.scrubber { cursor: pointer; border-color: var(--debug-color); }
    .audio-progress-bar { width: 0%; height: 100%; background: var(--accent-color); will-change: width; }
    .audio-progress-container.scrubber .audio-progress-bar { background: var(--debug-color); }

    .interval-notch { position: absolute; top: 0; bottom: 0; width: 2px; background: #262936; z-index: 2; pointer-events: none; }

    .controls-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn { background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: transform 0.1s; width: 100%; text-decoration: none; display: inline-block; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-skip { background: #333748; color: #fff; width: 40%; }
    .btn-skip:hover { background: #44495e; }
    .btn-next { background: #fff; display: none; margin-top: 15px; width: 100%; }
    .btn-restart { background: var(--error-color); color: #fff; display: none; margin-top: 15px; width: 100%; }
    .btn-sc { background: var(--sc-orange); color: #fff; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; }

    .search-container { position: relative; margin-bottom: 15px; }
    input[type="text"] { width: 100%; padding: 12px; background: #0d0e12; border: 1px solid #333748; color: #fff; border-radius: 6px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent-color); }
    
    .dropdown { position: absolute; width: 100%; background: #1f222e; border: 1px solid #333748; border-radius: 6px; max-height: 180px; overflow-y: auto; z-index: 10; display: none; text-align: left; }
    .dropdown-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #2a2e3d; }
    .dropdown-item:hover { background: var(--accent-color); color: #000; }
    .dropdown-item.debug { background: rgba(227, 100, 20, 0.2); color: var(--debug-color); border-bottom: 1px solid var(--debug-color); }
    .dropdown-item.debug:hover { background: var(--debug-color); color: #fff; }

    .attempts-tracker { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
    .attempt-box { width: 45px; height: 35px; border: 1px solid #333748; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 4px; color: var(--muted-color); }
    .attempt-box.active { border-color: var(--accent-color); color: var(--accent-color); font-weight: bold; }
    .attempt-box.fail { background: var(--error-color); color: #fff; border-color: var(--error-color); }
    .attempt-box.success { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; }

    .result-msg { font-size: 1rem; font-weight: bold; margin-top: 15px; min-height: 25px; line-height: 1.4; }

    /* Victory Modal Popup */
    .victory-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; padding: 20px; backface-visibility: hidden; transform: translateZ(0); }
    .victory-card { background: var(--card-bg); border: 2px solid var(--accent-color); border-radius: 16px; width: 100%; max-width: 420px; padding: 25px; text-align: center; box-shadow: 0 0 24px rgba(0,255,204,0.25); will-change: transform, opacity; animation: popIn 0.25s ease-out; }
    @keyframes popIn { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .victory-title { color: var(--accent-color); font-size: 1.6rem; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
    .album-art { width: 180px; height: 180px; border-radius: 12px; object-fit: cover; border: 2px solid #333748; margin: 0 auto 15px auto; display: block; background: #0d0e12; backface-visibility: hidden; }
    .track-name-display { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .artist-name-display { font-size: 1rem; color: var(--muted-color); margin-bottom: 15px; }
    .points-breakdown { background: #0d0e12; border: 1px solid #262936; border-radius: 8px; padding: 10px; font-size: 0.9rem; color: var(--accent-color); margin-bottom: 15px; }

    /* Debug Song Selector Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--debug-color); border-radius: 12px; width: 100%; max-width: 550px; max-height: 80vh; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #262936; padding-bottom: 10px; }
    .modal-title { color: var(--debug-color); font-size: 1.2rem; font-weight: bold; }
    .close-modal-btn { background: transparent; border: none; color: var(--muted-color); font-size: 1.5rem; cursor: pointer; }
    .close-modal-btn:hover { color: #fff; }
    .debug-search-input { margin-bottom: 12px; }
    .song-list-scroll { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; text-align: left; }
    .song-list-item { background: #0d0e12; border: 1px solid #262936; padding: 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: border-color 0.2s; }
    .song-list-item:hover { border-color: var(--debug-color); background: #141720; }
    .song-item-info { display: flex; flex-direction: column; }
    .song-item-id { font-size: 0.75rem; color: var(--debug-color); font-weight: bold; font-family: monospace; }
    .song-item-title { font-weight: bold; font-size: 0.95rem; color: #fff; }
    .song-item-artist { font-size: 0.85rem; color: var(--muted-color); }

    #sc-player { display: none; }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="container">
    <div class="test-mode-banner" id="test-banner">
      ⚠️ DEBUG MODE: SCRUBBER UNLOCKED
      <br>Exact Timestamp: <span class="timestamp-finder" id="live-time">0.00s</span>
    </div>

    <h1>BASS GUESSER</h1>
    <p class="subtitle">Dubstep & Riddim Edition</p>

    <div class="scoreboard">
      <div class="score-stat">
        <div class="score-label">Lives</div>
        <div class="score-val" id="lives-display">❤️❤️❤️</div>
      </div>
      <div class="score-stat">
        <div class="score-label">Score</div>
        <div class="score-val" id="total-score">0</div>
      </div>
      <div class="score-stat">
        <div class="score-label">Streak</div>
        <div class="score-val" id="current-streak">0 🔥</div>
      </div>
      <div class="score-stat">
        <div class="score-label">Skips</div>
        <div class="score-val" id="skips-display">⏭️ 3</div>
      </div>
    </div>

    <div id="diff-tag" class="diff-badge diff-easy">Difficulty: Easy</div>

    <div class="attempts-tracker">
      <div class="attempt-box active" id="box-0">0.5s</div>
      <div class="attempt-box" id="box-1">1.5s</div>
      <div class="attempt-box" id="box-2">3s</div>
      <div class="attempt-box" id="box-3">8s</div>
      <div class="attempt-box" id="box-4">16s</div>
    </div>

    <div class="audio-progress-container" id="progress-container" onclick="handleScrubberClick(event)">
      <div class="audio-progress-bar" id="progress-bar"></div>
    </div>

    <div class="controls-row">
      <button class="btn" id="play-btn" onclick="toggleAudio()">▶ PLAY AUDIO</button>
      <button class="btn btn-skip" id="skip-btn" onclick="skipTrack()">SKIP ⏭️</button>
    </div>

    <div class="search-container">
      <input type="text" id="guess-input" placeholder="Search artist or track title..." oninput="handleSearch()">
      <div class="dropdown" id="dropdown"></div>
    </div>

    <button class="btn btn-next" id="next-btn" onclick="triggerFadeOutAndNext()">NEXT TRACK ➔</button>
    <button class="btn btn-restart" id="restart-btn" onclick="restartGame()">GAME OVER - PLAY AGAIN 🔄</button>

    <div class="result-msg" id="result-msg"></div>
  </div>

  <!-- Victory Modal Screen -->
  <div class="victory-modal-overlay" id="victory-modal">
    <div class="victory-card">
      <div class="victory-title">🎉 TRACK GUESSED!</div>
      <img id="victory-artwork" class="album-art" src="" alt="Album Artwork">
      <div class="track-name-display" id="victory-track-title">Track Title</div>
      <div class="artist-name-display" id="victory-artist">Artist Name</div>
      
      <div class="points-breakdown" id="victory-points-msg">+0 PTS</div>

      <button id="victory-sc-btn" onclick="handleSoundCloudClick()" class="btn btn-sc">
        LISTEN ON SOUNDCLOUD 🎧
      </button>

      <button class="btn btn-next" style="display:block; margin-top:15px;" onclick="closeVictoryModalAndNext()">NEXT TRACK ➔</button>
    </div>
  </div>

  <!-- Debug Song Selector Modal -->
  <div class="modal-overlay" id="debug-modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">🛠️ DEBUG: SELECT SONG TO LOAD</div>
        <button class="close-modal-btn" onclick="closeDebugModal()">&times;</button>
      </div>
      <input type="text" class="debug-search-input" id="modal-search" placeholder="Filter by song name, artist, or ID..." oninput="filterModalSongs()">
      <div class="song-list-scroll" id="modal-song-list"></div>
    </div>
  </div>

  <iframe id="sc-player" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&show_artwork=false" allow="autoplay"></iframe>

  <script>
    const INTERVALS = [0.5, 1.5, 3, 8, 16];
    const MAX_INTERVAL_SEC = 16;
    const ATTEMPT_MULTIPLIERS = [5.0, 3.0, 2.0, 1.25, 1.0];
    const BASE_SCORE = 1000;

    const DIFFICULTY_MULTIPLIERS = {
      "Easy": 1.0,
      "Medium": 1.25,
      "Hard": 1.5,
      "Expert": 2.0,
      "Impossible": 3.0
    };

    let songs = [];
    let songDeck = [];
    let currentSong = null;
    let currentAttempt = 0;
    let widget = null;
    let isGameOver = false;
    let isReady = false;
    let isTestMode = false;
    let isDebugPlaying = false;
    
    let animFrameId = null;
    let fadeOutInterval = null;
    let songDurationMs = 0;
    let preloadedArtworkObj = null;

    // Player Resources
    let lives = 3;
    let skips = 3;
    let totalScore = 0;
    let currentStreak = 0;
    let successfulGuessesCounter = 0;

    window.onload = async () => {
      try {
        widget = SC.Widget(document.getElementById('sc-player'));
        
        widget.bind(SC.Widget.Events.READY, () => {
          isReady = true;
        });

        renderNotches();
        initConfetti();

        const response = await fetch('songs.json');
        if (!response.ok) throw new Error("Could not load songs.json");
        songs = await response.json();
        
        if (songs.length > 0) {
          shuffleDeck();
          loadNextSong();
        } else {
          document.getElementById('result-msg').innerText = "JSON file is empty.";
        }
      } catch (err) {
        console.error(err);
        document.getElementById('result-msg').innerText = "⚠️ Error loading songs.json file. Check JSON formatting.";
        document.getElementById('result-msg').style.color = "var(--error-color)";
      }
    };

    function renderNotches() {
      const container = document.getElementById('progress-container');
      for (let i = 0; i < INTERVALS.length - 1; i++) {
        const notchSec = INTERVALS[i];
        const pct = (notchSec / MAX_INTERVAL_SEC) * 100;
        const notch = document.createElement('div');
        notch.className = 'interval-notch';
        notch.style.left = `${pct}%`;
        container.appendChild(notch);
      }
    }

    function shuffleDeck() {
      songDeck = [...songs];
      for (let i = songDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [songDeck[i], songDeck[j]] = [songDeck[j], songDeck[i]];
      }
    }

    /* 2-Second Smooth Volume Fade-Out Engine */
    function fadeOutAudio(onCompleteCallback) {
      if (!widget) { if (onCompleteCallback) onCompleteCallback(); return; }
      
      if (fadeOutInterval) clearInterval(fadeOutInterval);
      let currentVol = 100;
      const stepMs = 50;
      const volStep = 100 / (2000 / stepMs);

      fadeOutInterval = setInterval(() => {
        currentVol -= volStep;
        if (currentVol <= 0) {
          clearInterval(fadeOutInterval);
          fadeOutInterval = null;
          widget.setVolume(0);
          widget.pause();
          if (onCompleteCallback) onCompleteCallback();
        } else {
          widget.setVolume(Math.max(0, Math.floor(currentVol)));
        }
      }, stepMs);
    }

    function triggerFadeOutAndNext() {
      fadeOutAudio(() => {
        loadNextSong();
      });
    }

    /* SoundCloud Link Handler: Instantly Opens Tab & Queues Next Song */
    function handleSoundCloudClick() {
      if (!currentSong || !currentSong.soundcloudUrl) return;
      
      // 1. Open SoundCloud link immediately in a new tab (bypasses browser popup blockers)
      window.open(currentSong.soundcloudUrl, '_blank');
      
      // 2. Close victory window
      document.getElementById('victory-modal').style.display = 'none';
      
      // 3. Fade out audio & load the next track so it's ready when the player returns
      triggerFadeOutAndNext();
    }

    function openDebugModal() {
      document.getElementById('debug-modal').style.display = 'flex';
      document.getElementById('modal-search').value = '';
      populateModalSongList(songs);
    }

    function closeDebugModal() {
      document.getElementById('debug-modal').style.display = 'none';
    }

    function populateModalSongList(list) {
      const container = document.getElementById('modal-song-list');
      container.innerHTML = '';
      
      list.forEach(s => {
        const item = document.createElement('div');
        item.className = 'song-list-item';
        item.onclick = () => {
          closeDebugModal();
          forceLoadSongById(s.id);
        };
        
        const diff = s.difficulty || 'Easy';

        item.innerHTML = `
          <div class="song-item-info">
            <span class="song-item-id">ID #${s.id}</span>
            <span class="song-item-title">${s.title}</span>
            <span class="song-item-artist">${s.artist}</span>
          </div>
          <div class="diff-badge diff-${diff.toLowerCase()}">${diff}</div>
        `;
        container.appendChild(item);
      });
    }

    function filterModalSongs() {
      const query = document.getElementById('modal-search').value.toLowerCase().trim();
      const filtered = songs.filter(s => 
        String(s.id).includes(query) ||
        s.title.toLowerCase().includes(query) ||
        s.artist.toLowerCase().includes(query)
      );
      populateModalSongList(filtered);
    }

    function forceLoadSongById(targetId) {
      const found = songs.find(s => String(s.id) === String(targetId));
      if (!found) {
        alert(`Song ID "${targetId}" not found in songs.json!`);
        return;
      }
      isTestMode = true;
      document.getElementById('test-banner').style.display = 'block';
      document.getElementById('progress-container').classList.add('scrubber');
      loadNextSong(found);
    }

    function loadNextSong(forcedSong = null) {
      if (fadeOutInterval) { clearInterval(fadeOutInterval); fadeOutInterval = null; }
      
      isGameOver = false;
      isReady = false;
      isDebugPlaying = false;
      currentAttempt = 0;
      preloadedArtworkObj = null;
      stopMeterFrameLoop();
      resetProgressBar();
      
      const playBtn = document.getElementById('play-btn');
      playBtn.innerText = '⏳ LOADING AUDIO...';
      playBtn.disabled = true;

      document.getElementById('result-msg').innerText = '';
      document.getElementById('guess-input').value = '';
      document.getElementById('dropdown').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('restart-btn').style.display = 'none';
      playBtn.style.display = 'block';
      document.getElementById('skip-btn').disabled = (skips <= 0);
      updateTrackerUI();
      updateDashboardUI();

      if (forcedSong) {
        currentSong = forcedSong;
      } else {
        if (!isTestMode) {
          document.getElementById('test-banner').style.display = 'none';
          document.getElementById('progress-container').classList.remove('scrubber');
        }
        
        if (songDeck.length === 0) {
          shuffleDeck();
        }
        currentSong = songDeck.pop();
      }
      
      const diff = currentSong.difficulty || "Easy";
      const mult = DIFFICULTY_MULTIPLIERS[diff] || 1.0;
      const diffTag = document.getElementById('diff-tag');
      diffTag.innerText = `Difficulty: ${diff} (${mult}x)`;
      diffTag.className = `diff-badge diff-${diff.toLowerCase()}`;

      widget.load(currentSong.soundcloudUrl, {
        auto_play: false,
        show_artwork: true,
        callback: () => {
          widget.setVolume(100);
          widget.getDuration((dur) => {
            songDurationMs = dur;
          });

          widget.getSounds((sounds) => {
            if (sounds && sounds.length > 0 && sounds[0].artwork_url) {
              const highResArtUrl = sounds[0].artwork_url.replace('-large', '-t500x500');
              preloadedArtworkObj = new Image();
              preloadedArtworkObj.src = highResArtUrl;
            }
          });

          if (!isTestMode) {
            widget.seekTo(Math.floor(currentSong.startTime * 1000));
          } else {
            widget.seekTo(0);
          }

          setTimeout(() => {
            isReady = true;
            playBtn.innerText = '▶ PLAY AUDIO';
            playBtn.disabled = false;
          }, 400);
        }
      });
    }

    function toggleAudio() {
      if (!widget || !isReady) return;
      widget.setVolume(100);

      const playBtn = document.getElementById('play-btn');

      if (isTestMode) {
        if (isDebugPlaying) {
          widget.pause();
          isDebugPlaying = false;
          stopMeterFrameLoop();
          playBtn.innerText = '▶ PLAY AUDIO';
        } else {
          widget.play();
          isDebugPlaying = true;
          startMeterFrameLoop();
          playBtn.innerText = '⏸ PAUSE AUDIO';
        }
        return;
      }

      if (isGameOver) return;
      const snippetSec = INTERVALS[currentAttempt];
      const startMs = Math.floor(currentSong.startTime * 1000);
      const endMs = startMs + (snippetSec * 1000);

      widget.seekTo(startMs);
      widget.play();
      startMeterFrameLoop(startMs, endMs);

      setTimeout(() => {
        if (!isGameOver && !isTestMode) {
          widget.pause();
          stopMeterFrameLoop();
          resetProgressBar();
        }
      }, snippetSec * 1000);
    }

    function startMeterFrameLoop(startMs = 0, endMs = 0) {
      stopMeterFrameLoop();

      function updateFrame() {
        if (!widget) return;
        widget.getPosition((currentMs) => {
          if (isTestMode) {
            const seconds = (currentMs / 1000).toFixed(2);
            document.getElementById('live-time').innerText = `${seconds}s`;
            if (songDurationMs > 0) {
              const pct = (currentMs / songDurationMs) * 100;
              document.getElementById('progress-bar').style.width = `${Math.min(pct, 100)}%`;
            }
          } else {
            const elapsedMs = Math.max(0, currentMs - startMs);
            const elapsedSec = elapsedMs / 1000;
            const pctOfTotalBar = (elapsedSec / MAX_INTERVAL_SEC) * 100;
            document.getElementById('progress-bar').style.width = `${Math.min(pctOfTotalBar, 100)}%`;
          }
        });

        animFrameId = requestAnimationFrame(updateFrame);
      }

      animFrameId = requestAnimationFrame(updateFrame);
    }

    function stopMeterFrameLoop() {
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }
    }

    function resetProgressBar() {
      document.getElementById('progress-bar').style.width = '0%';
    }

    function handleScrubberClick(event) {
      if (!isTestMode || !songDurationMs || !widget) return;
      const container = document.getElementById('progress-container');
      const rect = container.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const pct = clickX / rect.width;
      const targetMs = Math.floor(pct * songDurationMs);
      
      widget.seekTo(targetMs);
      document.getElementById('progress-bar').style.width = `${pct * 100}%`;
      document.getElementById('live-time').innerText = `${(targetMs / 1000).toFixed(2)}s`;
    }

    function skipTrack() {
      if (skips <= 0 || isGameOver) return;
      skips--;
      updateDashboardUI();
      document.getElementById('result-msg').innerHTML = `<span style="color:var(--muted-color);">Skipped track: <strong>${currentSong.artist} - ${currentSong.title}</strong></span>`;
      endRound(false);
    }

    function handleSearch() {
      const input = document.getElementById('guess-input').value.trim();
      const dropdown = document.getElementById('dropdown');
      dropdown.innerHTML = '';

      if (input.length < 2 || isGameOver) {
        dropdown.style.display = 'none';
        return;
      }

      if (input.toLowerCase().startsWith('id:')) {
        const queryId = input.substring(3).trim();
        dropdown.style.display = 'block';
        
        const item = document.createElement('div');
        item.className = 'dropdown-item debug';
        
        if (queryId.length === 0 || queryId.toLowerCase() === 'list') {
          item.innerText = `🛠️ OPEN DEBUG SONG SELECTOR MENU`;
          item.onclick = () => {
            dropdown.style.display = 'none';
            document.getElementById('guess-input').value = '';
            openDebugModal();
          };
        } else {
          item.innerText = `🛠️ DEV COMMAND: Load Song ID #${queryId}`;
          item.onclick = () => forceLoadSongById(queryId);
        }
        
        dropdown.appendChild(item);
        return;
      }

      const matches = songs.filter(s => 
        s.title.toLowerCase().includes(input.toLowerCase()) || 
        s.artist.toLowerCase().includes(input.toLowerCase())
      );

      if (matches.length > 0) {
        dropdown.style.display = 'block';
        matches.forEach(s => {
          const item = document.createElement('div');
          item.className = 'dropdown-item';
          item.innerText = `${s.artist} - ${s.title}`;
          item.onclick = () => submitGuess(s);
          dropdown.appendChild(item);
        });
      } else {
        dropdown.style.display = 'none';
      }
    }

    function submitGuess(selectedSong) {
      document.getElementById('dropdown').style.display = 'none';
      document.getElementById('guess-input').value = '';

      if (selectedSong.id === currentSong.id) {
        document.getElementById(`box-${currentAttempt}`).className = 'attempt-box success';
        
        const diffName = currentSong.difficulty || "Easy";
        const diffMult = DIFFICULTY_MULTIPLIERS[diffName] || 1.0;
        const attemptMult = ATTEMPT_MULTIPLIERS[currentAttempt];
        const pointsEarned = Math.round(BASE_SCORE * diffMult * attemptMult);
        
        if (!isTestMode) {
          totalScore += pointsEarned;
          currentStreak++;
          successfulGuessesCounter++;

          let skipBonusMsg = "";
          if (successfulGuessesCounter % 10 === 0) {
            skips++;
            skipBonusMsg = "<br><span style='color:#00ffcc; font-weight:bold;'>🎁 BONUS: +1 SKIP EARNED!</span>";
          }

          updateDashboardUI();
          showVictoryModal(pointsEarned, diffMult, attemptMult, skipBonusMsg);
        } else {
          showVictoryModal(0, diffMult, attemptMult, "<br>(Debug Mode)");
        }
        
        triggerConfettiBurst();
        endRound(true);
      } else {
        document.getElementById(`box-${currentAttempt}`).className = 'attempt-box fail';
        currentAttempt++;

        if (currentAttempt >= INTERVALS.length) {
          if (!isTestMode) {
            lives--;
            currentStreak = 0;
            updateDashboardUI();
          }

          document.getElementById('result-msg').innerHTML = `❌ OUT OF GUESSES!<br>Track was: <strong>${currentSong.artist} - ${currentSong.title}</strong>`;
          document.getElementById('result-msg').style.color = 'var(--error-color)';
          endRound(false);
        } else {
          updateTrackerUI();
        }
      }
    }

    function showVictoryModal(points, diffMult, attemptMult, bonusMsg) {
      document.getElementById('victory-track-title').innerText = currentSong.title;
      document.getElementById('victory-artist').innerText = currentSong.artist;
      document.getElementById('victory-points-msg').innerHTML = `+${points.toLocaleString()} PTS (${diffMult}x Diff × ${attemptMult}x Speed)${bonusMsg}`;

      const artImg = document.getElementById('victory-artwork');
      if (preloadedArtworkObj && preloadedArtworkObj.src) {
        artImg.src = preloadedArtworkObj.src;
      } else {
        artImg.src = "https://i1.sndcdn.com/avatars-000347293844-0a3k9v-t500x500.jpg";
      }

      setTimeout(() => {
        document.getElementById('victory-modal').style.display = 'flex';
      }, 20);
    }

    function closeVictoryModalAndNext() {
      document.getElementById('victory-modal').style.display = 'none';
      triggerFadeOutAndNext();
    }

    function updateDashboardUI() {
      let heartsStr = "";
      for (let i = 0; i < 3; i++) {
        heartsStr += (i < lives) ? "❤️" : "🖤";
      }
      document.getElementById('lives-display').innerText = heartsStr;
      document.getElementById('total-score').innerText = totalScore.toLocaleString();
      document.getElementById('current-streak').innerText = `${currentStreak} 🔥`;
      document.getElementById('skips-display').innerText = `⏭️ ${skips}`;
    }

    function updateTrackerUI() {
      for (let i = 0; i < INTERVALS.length; i++) {
        const box = document.getElementById(`box-${i}`);
        if (i < currentAttempt) {
          box.className = 'attempt-box fail';
        } else if (i === currentAttempt) {
          box.className = 'attempt-box active';
        } else {
          box.className = 'attempt-box';
        }
      }
    }

    function endRound(isWin) {
      isGameOver = true;
      stopMeterFrameLoop();
      widget.setVolume(100);
      widget.seekTo(Math.floor(currentSong.startTime * 1000));
      widget.play();
      document.getElementById('skip-btn').disabled = true;

      if (!isWin) {
        if (lives <= 0 && !isTestMode) {
          document.getElementById('result-msg').innerHTML += `<br><span style="color:var(--error-color); font-size:1.2rem;">💀 GAME OVER! Final Score: ${totalScore.toLocaleString()}</span>`;
          document.getElementById('restart-btn').style.display = 'block';
        } else {
          document.getElementById('next-btn').style.display = 'block';
        }
      }
    }

    function restartGame() {
      lives = 3;
      skips = 3;
      totalScore = 0;
      currentStreak = 0;
      successfulGuessesCounter = 0;
      shuffleDeck();
      loadNextSong();
    }

    /* Slow Piñata-Style Widescreen Confetti Engine */
    let confettiParticles = [];
    let confettiAnimId = null;

    function initConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }

    function triggerConfettiBurst() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      const colors = ['#00ffcc', '#ff0055', '#ffe600', '#00d2ff', '#ff00ff', '#ffffff'];
      
      confettiParticles = [];
      const particleCount = 200;

      for (let i = 0; i < particleCount; i++) {
        // Broad initial spawn spanning 80% of screen width
        const spawnX = (canvas.width * 0.1) + (Math.random() * (canvas.width * 0.8));
        const spawnY = canvas.height * 0.25;

        confettiParticles.push({
          x: spawnX,
          y: spawnY,
          vx: (Math.random() - 0.5) * 8, // Soft side drift
          vy: Math.random() * -4 - 1,    // Light initial upward flutter
          width: Math.random() * 10 + 6,
          height: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 4,
          alpha: 0.80,
          decay: 0.0035, // ~3.5 to 4 second slow piñata decay
          wobble: Math.random() * 20
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

      function renderConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let active = false;

        confettiParticles.forEach(p => {
          if (p.alpha > 0) {
            active = true;
            p.wobble += 0.04;
            p.x += p.vx + Math.sin(p.wobble) * 1.5; // Feathered paper flutter
            p.y += p.vy;
            p.vy += 0.06; // Super light gravity float
            p.vx *= 0.98;
            p.rotation += p.rotSpeed;
            p.alpha -= p.decay;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.width / 2, -p.height / 2, p.width, p.height);
            ctx.restore();
          }
        });

        if (active) {
          confettiAnimId = requestAnimationFrame(renderConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      renderConfetti();
    }
  </script>
</body>
