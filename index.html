<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riddim / Dubstep Guesser</title>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #16181f;
      --accent-color: #00ffcc;
      --text-color: #ffffff;
      --muted-color: #a0a5b5;
      --error-color: #ff4757;
      --debug-color: #e36414;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 500px; background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; border: 1px solid #262936; position: relative; }
    h1 { color: var(--accent-color); font-size: 1.8rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
    p.subtitle { color: var(--muted-color); font-size: 0.9rem; margin-bottom: 15px; }

    /* Debug Tool Banner & Live Timer */
    .test-mode-banner { display: none; background: rgba(227, 100, 20, 0.2); color: var(--debug-color); border: 1px solid var(--debug-color); padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-bottom: 12px; }
    .timestamp-finder { font-family: monospace; font-size: 1.1rem; color: #fff; background: #000; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--debug-color); margin-top: 5px; display: inline-block; }

    .scoreboard { display: flex; justify-content: space-between; background: #0d0e12; padding: 12px 18px; border-radius: 8px; border: 1px solid #262936; margin-bottom: 15px; }
    .score-stat { text-align: center; }
    .score-label { font-size: 0.75rem; color: var(--muted-color); text-transform: uppercase; letter-spacing: 1px; }
    .score-val { font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }

    .diff-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
    .diff-easy { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
    .diff-medium { background: rgba(255, 171, 0, 0.2); color: #ffab00; border: 1px solid #ffab00; }
    .diff-hard { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
    .diff-expert { background: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }
    .diff-impossible { background: rgba(230, 126, 34, 0.2); color: #e67e22; border: 1px solid #e67e22; box-shadow: 0 0 10px rgba(230, 126, 34, 0.4); }

    .controls-row { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn { background: var(--accent-color); color: #000; font-weight: bold; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; transition: transform 0.1s; width: 100%; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-skip { background: #333748; color: #fff; width: 40%; }
    .btn-skip:hover { background: #44495e; }
    .btn-next { background: #fff; display: none; margin-top: 15px; width: 100%; }
    .btn-restart { background: var(--error-color); color: #fff; display: none; margin-top: 15px; width: 100%; }

    .search-container { position: relative; margin-bottom: 15px; }
    input[type="text"] { width: 100%; padding: 12px; background: #0d0e12; border: 1px solid #333748; color: #fff; border-radius: 6px; font-size: 1rem; outline: none; }
    input[type="text"]:focus { border-color: var(--accent-color); }
    
    .dropdown { position: absolute; width: 100%; background: #1f222e; border: 1px solid #333748; border-radius: 6px; max-height: 180px; overflow-y: auto; z-index: 10; display: none; text-align: left; }
    .dropdown-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #2a2e3d; }
    .dropdown-item:hover { background: var(--accent-color); color: #000; }
    .dropdown-item.debug { background: rgba(227, 100, 20, 0.2); color: var(--debug-color); border-bottom: 1px solid var(--debug-color); }
    .dropdown-item.debug:hover { background: var(--debug-color); color: #fff; }

    .attempts-tracker { display: flex; gap: 8px; justify-content: center; margin-bottom: 15px; }
    .attempt-box { width: 45px; height: 35px; border: 1px solid #333748; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; border-radius: 4px; color: var(--muted-color); }
    .attempt-box.active { border-color: var(--accent-color); color: var(--accent-color); font-weight: bold; }
    .attempt-box.fail { background: var(--error-color); color: #fff; border-color: var(--error-color); }
    .attempt-box.success { background: var(--accent-color); color: #000; border-color: var(--accent-color); font-weight: bold; }

    .result-msg { font-size: 1rem; font-weight: bold; margin-top: 15px; min-height: 25px; line-height: 1.4; }
    #sc-player { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="test-mode-banner" id="test-banner">
      ⚠️ DEBUG MODE: TEST TRACK LOADED
      <br>Exact Current Timestamp: <span class="timestamp-finder" id="live-time">0.00s</span>
    </div>

    <h1>BASS GUESSER</h1>
    <p class="subtitle">Dubstep & Riddim Edition</p>

    <!-- Score & Resource Dashboard -->
    <div class="scoreboard">
      <div class="score-stat">
        <div class="score-label">Lives</div>
        <div class="score-val" id="lives-display">❤️❤️❤️</div>
      </div>
      <div class="score-stat">
        <div class="score-label">Score</div>
        <div class="score-val" id="total-score">0</div>
      </div>
      <div class="score-stat">
        <div class="score-label">Streak</div>
        <div class="score-val" id="current-streak">0 🔥</div>
      </div>
      <div class="score-stat">
        <div class="score-label">Skips</div>
        <div class="score-val" id="skips-display">⏭️ 3</div>
      </div>
    </div>

    <div id="diff-tag" class="diff-badge diff-easy">Difficulty: Easy</div>

    <div class="attempts-tracker">
      <div class="attempt-box active" id="box-0">0.5s</div>
      <div class="attempt-box" id="box-1">1.5s</div>
      <div class="attempt-box" id="box-2">3s</div>
      <div class="attempt-box" id="box-3">8s</div>
      <div class="attempt-box" id="box-4">16s</div>
    </div>

    <div class="controls-row">
      <button class="btn" id="play-btn" onclick="playSnippet()">▶ PLAY AUDIO</button>
      <button class="btn btn-skip" id="skip-btn" onclick="skipTrack()">SKIP ⏭️</button>
    </div>

    <div class="search-container">
      <input type="text" id="guess-input" placeholder="Search artist or track title..." oninput="handleSearch()">
      <div class="dropdown" id="dropdown"></div>
    </div>

    <button class="btn btn-next" id="next-btn" onclick="loadNextSong()">NEXT TRACK ➔</button>
    <button class="btn btn-restart" id="restart-btn" onclick="restartGame()">GAME OVER - PLAY AGAIN 🔄</button>

    <div class="result-msg" id="result-msg"></div>
  </div>

  <iframe id="sc-player" src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/293&show_artwork=false" allow="autoplay"></iframe>

  <script>
    const INTERVALS = [0.5, 1.5, 3, 8, 16];
    const ATTEMPT_MULTIPLIERS = [5.0, 3.0, 2.0, 1.25, 1.0];
    const BASE_SCORE = 1000;

    const DIFFICULTY_MULTIPLIERS = {
      "Easy": 1.0,
      "Medium": 1.25,
      "Hard": 1.5,
      "Expert": 2.0,
      "Impossible": 3.0
    };

    let songs = [];
    let songDeck = [];
    let currentSong = null;
    let currentAttempt = 0;
    let widget = null;
    let isGameOver = false;
    let isReady = false;
    let isTestMode = false;
    let debugTimerInterval = null;

    // Player Resources
    let lives = 3;
    let skips = 3;
    let totalScore = 0;
    let currentStreak = 0;
    let successfulGuessesCounter = 0; // Tracks progress toward next skip bonus

    window.onload = async () => {
      try {
        widget = SC.Widget(document.getElementById('sc-player'));
        
        widget.bind(SC.Widget.Events.READY, () => {
          isReady = true;
        });

        const response = await fetch('songs.json');
        if (!response.ok) throw new Error("Could not load songs.json");
        songs = await response.json();
        
        if (songs.length > 0) {
          shuffleDeck();
          loadNextSong();
        } else {
          document.getElementById('result-msg').innerText = "JSON file is empty.";
        }
      } catch (err) {
        console.error(err);
        document.getElementById('result-msg').innerText = "⚠️ Error loading songs.json file. Check JSON formatting.";
        document.getElementById('result-msg').style.color = "var(--error-color)";
      }
    };

    function shuffleDeck() {
      songDeck = [...songs];
      for (let i = songDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [songDeck[i], songDeck[j]] = [songDeck[j], songDeck[i]];
      }
    }

    function forceLoadSongById(targetId) {
      const found = songs.find(s => String(s.id) === String(targetId));
      if (!found) {
        alert(`Song ID "${targetId}" not found in songs.json!`);
        return;
      }
      isTestMode = true;
      document.getElementById('test-banner').style.display = 'block';
      startDebugTimer();
      loadNextSong(found);
    }

    function startDebugTimer() {
      if (debugTimerInterval) clearInterval(debugTimerInterval);
      debugTimerInterval = setInterval(() => {
        if (widget && isTestMode) {
          widget.getPosition((ms) => {
            const seconds = (ms / 1000).toFixed(2);
            document.getElementById('live-time').innerText = `${seconds}s`;
          });
        }
      }, 100);
    }

    function loadNextSong(forcedSong = null) {
      isGameOver = false;
      isReady = false;
      currentAttempt = 0;
      
      const playBtn = document.getElementById('play-btn');
      playBtn.innerText = '⏳ LOADING AUDIO...';
      playBtn.disabled = true;

      document.getElementById('result-msg').innerText = '';
      document.getElementById('guess-input').value = '';
      document.getElementById('dropdown').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('restart-btn').style.display = 'none';
      playBtn.style.display = 'block';
      document.getElementById('skip-btn').disabled = (skips <= 0);
      updateTrackerUI();
      updateDashboardUI();

      if (forcedSong) {
        currentSong = forcedSong;
      } else {
        if (!isTestMode) {
          document.getElementById('test-banner').style.display = 'none';
          if (debugTimerInterval) clearInterval(debugTimerInterval);
        }
        
        if (songDeck.length === 0) {
          shuffleDeck();
        }
        currentSong = songDeck.pop();
      }
      
      const diff = currentSong.difficulty || "Easy";
      const mult = DIFFICULTY_MULTIPLIERS[diff] || 1.0;
      const diffTag = document.getElementById('diff-tag');
      diffTag.innerText = `Difficulty: ${diff} (${mult}x)`;
      diffTag.className = `diff-badge diff-${diff.toLowerCase()}`;

      widget.load(currentSong.soundcloudUrl, {
        auto_play: false,
        show_artwork: false,
        callback: () => {
          widget.seekTo(Math.floor(currentSong.startTime * 1000));
          setTimeout(() => {
            isReady = true;
            playBtn.innerText = '▶ PLAY AUDIO';
            playBtn.disabled = false;
          }, 400);
        }
      });
    }

    function playSnippet() {
      if (!widget || isGameOver || !isReady) return;
      const duration = INTERVALS[currentAttempt];
      
      widget.seekTo(Math.floor(currentSong.startTime * 1000));
      widget.play();

      setTimeout(() => {
        if (!isGameOver) {
          widget.pause();
        }
      }, duration * 1000);
    }

    function skipTrack() {
      if (skips <= 0 || isGameOver) return;
      skips--;
      updateDashboardUI();
      document.getElementById('result-msg').innerHTML = `<span style="color:var(--muted-color);">Skipped track: <strong>${currentSong.artist} - ${currentSong.title}</strong></span>`;
      endRound(false);
    }

    function handleSearch() {
      const input = document.getElementById('guess-input').value.trim();
      const dropdown = document.getElementById('dropdown');
      dropdown.innerHTML = '';

      if (input.length < 2 || isGameOver) {
        dropdown.style.display = 'none';
        return;
      }

      if (input.toLowerCase().startsWith('id:')) {
        const queryId = input.substring(3).trim();
        dropdown.style.display = 'block';
        const item = document.createElement('div');
        item.className = 'dropdown-item debug';
        item.innerText = `🛠️ DEV COMMAND: Load Song ID #${queryId}`;
        item.onclick = () => forceLoadSongById(queryId);
        dropdown.appendChild(item);
        return;
      }

      const matches = songs.filter(s => 
        s.title.toLowerCase().includes(input.toLowerCase()) || 
        s.artist.toLowerCase().includes(input.toLowerCase())
      );

      if (matches.length > 0) {
        dropdown.style.display = 'block';
        matches.forEach(s => {
          const item = document.createElement('div');
          item.className = 'dropdown-item';
          item.innerText = `${s.artist} - ${s.title}`;
          item.onclick = () => submitGuess(s);
          dropdown.appendChild(item);
        });
      } else {
        dropdown.style.display = 'none';
      }
    }

    function submitGuess(selectedSong) {
      document.getElementById('dropdown').style.display = 'none';
      document.getElementById('guess-input').value = '';

      if (selectedSong.id === currentSong.id) {
        document.getElementById(`box-${currentAttempt}`).className = 'attempt-box success';
        
        const diffName = currentSong.difficulty || "Easy";
        const diffMult = DIFFICULTY_MULTIPLIERS[diffName] || 1.0;
        const attemptMult = ATTEMPT_MULTIPLIERS[currentAttempt];
        const pointsEarned = Math.round(BASE_SCORE * diffMult * attemptMult);
        
        if (!isTestMode) {
          totalScore += pointsEarned;
          currentStreak++;
          successfulGuessesCounter++;

          // Award bonus skip every 10 correct songs
          let skipBonusMsg = "";
          if (successfulGuessesCounter % 10 === 0) {
            skips++;
            skipBonusMsg = "<br><span style='color:#00ffcc; font-weight:bold;'>🎁 BONUS: +1 SKIP EARNED!</span>";
          }

          updateDashboardUI();
          document.getElementById('result-msg').innerHTML = `🎉 CORRECT!<br><strong>${currentSong.artist} - ${currentSong.title}</strong><br><span style="color:#00ffcc; font-size:0.9rem;">+${pointsEarned.toLocaleString()} PTS (${diffMult}x Diff × ${attemptMult}x Speed)</span>${skipBonusMsg}`;
        } else {
          document.getElementById('result-msg').innerHTML = `🎉 CORRECT (TEST MODE)!<br><strong>${currentSong.artist} - ${currentSong.title}</strong>`;
        }
        
        document.getElementById('result-msg').style.color = 'var(--accent-color)';
        endRound(true);
      } else {
        document.getElementById(`box-${currentAttempt}`).className = 'attempt-box fail';
        currentAttempt++;

        if (currentAttempt >= INTERVALS.length) {
          if (!isTestMode) {
            lives--;
            currentStreak = 0;
            updateDashboardUI();
          }

          document.getElementById('result-msg').innerHTML = `❌ OUT OF GUESSES!<br>Track was: <strong>${currentSong.artist} - ${currentSong.title}</strong>`;
          document.getElementById('result-msg').style.color = 'var(--error-color)';
          endRound(false);
        } else {
          updateTrackerUI();
        }
      }
    }

    function updateDashboardUI() {
      // Format Hearts for Lives
      let heartsStr = "";
      for (let i = 0; i < 3; i++) {
        heartsStr += (i < lives) ? "❤️" : "🖤";
      }
      document.getElementById('lives-display').innerText = heartsStr;
      document.getElementById('total-score').innerText = totalScore.toLocaleString();
      document.getElementById('current-streak').innerText = `${currentStreak} 🔥`;
      document.getElementById('skips-display').innerText = `⏭️ ${skips}`;
    }

    function updateTrackerUI() {
      for (let i = 0; i < INTERVALS.length; i++) {
        const box = document.getElementById(`box-${i}`);
        if (i < currentAttempt) {
          box.className = 'attempt-box fail';
        } else if (i === currentAttempt) {
          box.className = 'attempt-box active';
        } else {
          box.className = 'attempt-box';
        }
      }
    }

    function endRound(isWin) {
      isGameOver = true;
      widget.seekTo(Math.floor(currentSong.startTime * 1000));
      widget.play();
      document.getElementById('skip-btn').disabled = true;

      if (lives <= 0 && !isTestMode) {
        document.getElementById('result-msg').innerHTML += `<br><span style="color:var(--error-color); font-size:1.2rem;">💀 GAME OVER! Final Score: ${totalScore.toLocaleString()}</span>`;
        document.getElementById('restart-btn').style.display = 'block';
      } else {
        document.getElementById('next-btn').style.display = 'block';
      }
    }

    function restartGame() {
      lives = 3;
      skips = 3;
      totalScore = 0;
      currentStreak = 0;
      successfulGuessesCounter = 0;
      shuffleDeck();
      loadNextSong();
    }
  </script>
</body>
</html>
